mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: true
dns:
  enable: true
  enhanced-mode: redir-host
  default-nameservers: [1.1.1.1, 8.8.8.8]
  nameserver-over-tls: ["https+1.1.1.1:853#Cloudflare"]
  rules: ["RULE-SET,cn,dnss", "FINAL,dns"]
proxies:
-     name: vless_www.true.th_0
      server: www.true.th
      port: 0
      udp: true
      type: vless
      uuid: 7ce54bb3-d612-4aa7-be08-089d3c461d53
      tls: true
      servername: d1yxsk0zprgivr.cloudfront.net
      client-fingerprint: chrome
      network: ws
      ws-opts:
        path: /
-     name: vless_www.true.th_0
      server: www.true.th
      port: 0
      udp: true
      type: vless
      uuid: 7ce54bb3-d612-4aa7-be08-089d3c461d53
      tls: true
      servername: d1yxsk0zprgivr.cloudfront.net
      network: ws
      ws-opts:
        path: "/fp=chrome"
proxy-groups:
-     name: url-test
      type: url-test
      proxies: [vless_www.true.th_0, vless_www.true.th_0]
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      tolerance: 50
      expected-status: 204
rules: ["DOMAIN-KEYWORD,local,DIRECT", "DOMAIN-SUFFIX,localhost,DIRECT", "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve", "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve", "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve", "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve", "IP-CIDR6,::1/128,DIRECT,no-resolve", "MATCH,url-test"]
clash-api:
  external-controller: "0.0.0.0:9090"
  secret: ""
external-controller: "0.0.0.0:9090"
secret: ""
ipv6-hint: false
snell-address: []
redir-host: true