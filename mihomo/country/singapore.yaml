mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: true
dns:
  enable: true
  enhanced-mode: redir-host
  default-nameservers: [1.1.1.1, 8.8.8.8]
  nameserver-over-tls: ["https+1.1.1.1:853#Cloudflare"]
  rules: ["RULE-SET,cn,dnss", "FINAL,dns"]
proxies:
-     name: vless_www.visa.com.sg_0
      server: www.visa.com.sg
      port: 0
      udp: true
      type: vless
      uuid: 37d0b151-023e-4729-9994-45a7d9df5fd1
      tls: true
      servername: pardazeshvpn-tg23.pages.dev
      client-fingerprint: random
      network: ws
      ws-opts:
        path: "/TELEGRAM-MARAMBASHI/?ed=2048"
proxy-groups:
-     name: url-test
      type: url-test
      proxies: [vless_www.visa.com.sg_0]
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      tolerance: 50
      expected-status: 204
rules: ["DOMAIN-KEYWORD,local,DIRECT", "DOMAIN-SUFFIX,localhost,DIRECT", "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve", "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve", "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve", "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve", "IP-CIDR6,::1/128,DIRECT,no-resolve", "MATCH,url-test"]
clash-api:
  external-controller: "0.0.0.0:9090"
  secret: ""
external-controller: "0.0.0.0:9090"
secret: ""
ipv6-hint: false
snell-address: []
redir-host: true