name: Update V2Ray Subscriptions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to push back to subs/

env:
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can diff and commit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Raise file descriptor limit
        run: ulimit -n 65536

      - name: Fetch subscriptions
        run: python3 lib/fetch_subs.py --workers 16

      - name: Sort and classify
        run: python3 lib/sort_subs.py

      - name: Test and filter nodes (aggressive)
        # GitHub Actions ubuntu-latest runners can handle high concurrency
        # for lightweight TCP connect tests.
        #
        # Pipeline with aggressive timeouts:
        #   Phase 1: TCP connect test (0.5s timeout) — eliminates dead servers
        #   Phase 2: Latency measurement (1 sample, 0.5s timeout) — median latency
        #   Phase 3: Remove nodes >1000ms latency (IPv6 filtered during parsing)
        #
        # Concurrency 200 + 0.5s timeouts → ~300-400 nodes/sec throughput.
        # 125K nodes processed in ~5-7 minutes.
        run: |
          python3 lib/fasttest_singbox.py \
            --concurrency 200 \
            --timeout-connect 0.5 \
            --timeout-latency 0.5 \
            --samples 1 \
            --max-latency 1000

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet --exit-code subs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config --local user.name "$GIT_AUTHOR_NAME"
          git config --local user.email "$GIT_AUTHOR_EMAIL"
          git add subs/
          git commit -m "chore: update filtered subscriptions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
