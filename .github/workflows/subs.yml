name: Update V2Ray Subscriptions

on:
  schedule:
    # Run every 72 hours at 00:00 UTC
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to push back to subs/

env:
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can diff and commit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Raise file descriptor limit
        run: ulimit -n 65536

      - name: Fetch subscriptions
        # Some subscription URLs return 404/500 — that's expected and OK.
        continue-on-error: true
        run: python3 lib/fetch_subs.py --workers 16

      - name: Sort and classify
        run: python3 lib/sort_subs.py

      - name: Fast filter — TCP connect (dead server elimination)
        # 0.5s TCP connect timeout, 0.5s latency test, concurrency 200
        # Eliminates ~70% dead servers in ~3 minutes.
        # Surviving nodes are written to subs/*.txt in-place.
        run: |
          python3 lib/fasttest_singbox.py \
            --concurrency 200 \
            --timeout-connect 0.5 \
            --timeout-latency 0.5 \
            --samples 1 \
            --max-latency 1000

      - name: Organize subs
        # Move protocol files to subs/protocols/, create mix.txt, country/, 1000/
        run: python3 lib/organize_subs.py

      - name: Check for changes
        id: changes
        run: |
          git add -f subs/
          if git diff --quiet --cached --exit-code; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config --local user.name "$GIT_AUTHOR_NAME"
          git config --local user.email "$GIT_AUTHOR_EMAIL"
          git commit -m "chore: update filtered subscriptions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
