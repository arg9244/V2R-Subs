name: Update V2Ray Subscriptions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to push back to subs/

env:
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can diff and commit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Raise file descriptor limit
        run: ulimit -n 65536

      - name: Install sing-box
        run: |
          mkdir -p bin
          TAG=$(gh api repos/SagerNet/sing-box/releases/latest --jq '.tag_name')
          ASSET_TAG=${TAG#v}
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${ASSET_TAG}-linux-amd64.tar.gz" \
            | tar -xz -C bin --strip-components=1 --wildcards "*/sing-box"
          bin/sing-box version

      - name: Fetch subscriptions
        # Some subscription URLs return 404/500 — that's expected and OK.
        continue-on-error: true
        run: python3 lib/fetch_subs.py --workers 16

      - name: Sort and classify
        run: python3 lib/sort_subs.py

      - name: Fast filter — TCP connect (dead server elimination)
        # Phase 1: 0.5s TCP connect timeout, concurrency 200
        # Eliminates ~70% dead servers, ~300-400 nodes/sec throughput
        run: |
          python3 lib/fasttest_singbox.py \
            --concurrency 200 \
            --timeout-connect 0.5 \
            --timeout-latency 0.5 \
            --samples 1 \
            --max-latency 1000

      - name: Speed test — bandwidth filter (min 50mbps)
        # Phase 2: For surviving nodes, start sing-box proxy per node,
        # download 2.5MB test file, measure throughput, filter <50mbps.
        # Concurrency 50 (limited by sing-box process overhead + memory).
        # 125K nodes → TCP filter → ~42K survivors → ~10-15 min speed test.
        run: |
          python3 lib/speedtest_singbox.py \
            --concurrency 50 \
            --min-speed-mbps 50 \
            --test-url "https://speed.cloudflare.com/__down?bytes=2621440" \
            --speed-timeout 5

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet --exit-code subs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config --local user.name "$GIT_AUTHOR_NAME"
          git config --local user.email "$GIT_AUTHOR_EMAIL"
          git add subs/
          git commit -m "chore: update filtered subscriptions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
